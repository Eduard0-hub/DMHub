services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: db_barbearia
      MARIADB_USER: barberhub
      MARIADB_PASSWORD: barberhub
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MYSQLHOST: database
      MYSQLPORT: 3306
      MYSQLDATABASE: db_barbearia
      MYSQLUSER: barberhub
      MYSQLPASSWORD: barberhub
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./src
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mariadb-data:
